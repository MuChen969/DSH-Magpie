<?xml version="1.0" encoding="UTF-8"?>
<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dshMagpiePanel" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FA8FF"/>
      <stop offset="1" stop-color="#2B4BD8"/>
    </linearGradient>
    <linearGradient id="dshMagpiePlug" x1="20" y1="21" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BE3A6"/>
      <stop offset="1" stop-color="#0B9C86"/>
    </linearGradient>
  </defs>
  <!-- Workbench window: the embedded Magpie model-management panel -->
  <rect x="3" y="4" width="30" height="28" rx="3.6" fill="url(#dshMagpiePanel)"/>
  <!-- Window title bar -->
  <path d="M3 11 H33" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="1.2"/>
  <circle cx="7.2" cy="7.5" r="1.25" fill="#FFFFFF" fill-opacity="0.85"/>
  <!-- Panel slots representing managed model entries -->
  <rect x="7.5" y="15" width="8.5" height="6.5" rx="1.6" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="20" y="15" width="8.5" height="6.5" rx="1.6" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="7.5" y="24" width="8.5" height="5.5" rx="1.6" fill="#FFFFFF" fill-opacity="0.3"/>
  <!-- Accent slot with status indicator -->
  <rect x="20" y="23" width="8.5" height="6.5" rx="1.6" fill="url(#dshMagpiePlug)"/>
  <circle cx="32" cy="26.25" r="1.8" fill="#4BE3A6"/>
</svg>
